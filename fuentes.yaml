# ------------------------------------------------------------------------------
# Configuración del monitor de pasantías
# ------------------------------------------------------------------------------

# Si encuentra algo nuevo, completa en el Sheet (SOLO si la celda está vacía):
#   Estado = "Programa abierto", Programa de pasantías abierto = "Sí", Link = aviso
actualizar_sheet: true

filtros:
  # Lo que se le pide al buscador de cada sitio (Workday, SmartRecruiters, etc.)
  palabras_busqueda: [intern, pasante, pasantía, trainee, junior, "entry level", graduate]

  # ---------- 1) NIVEL: el título tiene que ser de pasantía O de junior ----------
  pasantia: >-
    intern|pasant|trainee|becari|estudiante|student|j[oó]ven(es)? profesional|
    early career|graduate program|programa de graduados|\bPPS\b|pr[aá]ctica profesional|
    summer analyst|aprendiz
  junior: >-
    junior|\bjr\b|entry[- ]level|graduate|new grad|reci[eé]n recibid|sin experiencia|
    early talent|analista (de )?trainee

  # ...y NO puede ser senior
  excluir: \b(senior|sr|semi ?senior|ssr|lead|manager|director|head of|principal|staff|gerente|jefe|l[ií]der)\b

  # ---------- 2) ÁREA: tiene que ser de sistemas / tecnología / datos / ingeniería ----------
  # Palabras "fuertes": si el título tiene alguna, entra (salvo excluir_area_siempre)
  area_tecnica: >-
    sistemas|software|developer|desarroll|programad|tecnolog|technology|\btech|
    data|datos|analytics|anal[ií]tica|business intelligence|cloud|devops|
    testing|tester|automatiza|automation|ciber|cyber|seguridad inform|information security|
    infraestructura|infrastructure|redes|networking|soporte t[eé]cnico|it support|helpdesk|
    frontend|front-end|backend|back-end|full ?stack|machine learning|inteligencia artificial|
    data science|ciencia de datos|comput|inform[aá]tic|telecom|pre-?sales|preventa|
    python|java|\.net|mobile|\brpa\b|consultor[ií]a funcional|functional consult|
    business analyst|analista funcional|functional analyst|analista de negocio|
    salesforce|\bsap\b|\berp\b|\bcrm\b
  # Siglas que tienen que estar en MAYÚSCULAS (para no confundir "it" con IT)
  area_tecnica_siglas: \b(IT|TI|BI|AI|IA|ML|QA|SRE|SAP|ERP|CRM|UX|API|IoT|IOT)\b

  # Palabras "débiles": entran solo si el título NO es de un área de excluir_area
  # (ej: "Engineering Intern" entra, "Marketing Innovation Intern" no)
  area_tecnica_debil: >-
    engineer|ingenier|technical|t[eé]cnic|digital|innovation|innovaci[oó]n|
    web|aplicaciones|applications|platform|plataforma|product owner|producto|product|
    scrum|agile|arquitect|architect|ux|ui designer|security|seguridad|network|procesos|process|
    consult|consultor|anal[iy]st|analista

  # Se descartan SIEMPRE, aunque digan "IT" o "data" (ej: "IT Recruiter")
  excluir_area_siempre: >-
    recruit|reclut|talent acquisition|selecci[oó]n de personal|payroll|n[oó]mina|
    legal|abogad|paralegal

  # Se descartan salvo que el título tenga una palabra "fuerte"
  # (ej: "Marketing Intern" no entra, "Marketing Data Analyst" sí)
  excluir_area: >-
    recursos humanos|rrhh|\bhr\b|human resources|people|compliance|
    marketing|comunicaci[oó]n|prensa|brand|marca|ventas|\bsales\b(?! engineer)|comercial|
    contab|accounting|impuestos|\btax|tesorer[ií]a|treasury|auditor[ií]a|audit|finanzas|finance|
    compras|procurement|log[ií]stica|logistics|supply chain|almac[eé]n|warehouse|
    atenci[oó]n al cliente|customer service|call center|administrativ|recepci[oó]n|
    m[eé]dic|farmac[eé]utic|qu[ií]mic|chemistry|laboratorio|enfermer|nurse|
    in-store|\bstore\b|tienda|vendedor|cajer|mantenimiento|maintenance|mec[aá]nic|
    hse|seguridad e higiene|safety|calidad de producto|planta|plant

  # Si el aviso trae ubicación, tiene que matchear esto.
  # Solo Buenos Aires (CABA + GBA). También acepta avisos que dicen solo "Argentina"
  # (sin ciudad), porque casi siempre son en Buenos Aires.
  ubicacion: >-
    buenos aires|\bcaba\b|capital federal|ciudad aut[oó]noma|\bBA\b|
    pilar|escobar|gar[ií]n|tigre|san isidro|vicente l[oó]pez|olivos|mart[ií]nez|munro|
    san fernando|nordelta|la plata|
    ^\W*(remote|remoto|hybrid|h[ií]brido)?\W*argentina\W*(remote|remoto|hybrid|h[ií]brido)?\W*$

  # Empresas del Sheet con estos estados no se monitorean
  excluir_estados: ["Descartada por mí"]

# ------------------------------------------------------------------------------
