# ------------------------------------------------------------------------------
# Configuración del monitor de pasantías
# ------------------------------------------------------------------------------

# Si encuentra algo nuevo, completa en el Sheet (SOLO si la celda está vacía):
#   Estado = "Programa abierto", Programa de pasantías abierto = "Sí", Link = aviso
actualizar_sheet: true

filtros:
  # Lo que se le pide al buscador de cada sitio (Workday, SmartRecruiters, etc.)
  palabras_busqueda: [intern, pasante, pasantía, trainee]

  # El TÍTULO del aviso tiene que matchear esto (regex, sin distinguir mayúsculas)
  incluir: >-
    intern|pasant|trainee|becari|estudiante|student|joven(es)? profesional|
    early career|graduate program|programa de graduados|\bPPS\b|pr[aá]ctica profesional|
    summer analyst|aprendiz

  # ...y NO matchear esto
  excluir: \b(senior|sr\.?|lead|manager|director|head of|principal)\b

    # Si el aviso trae ubicación, tiene que matchear esto.
  # Solo Buenos Aires (CABA + GBA). También acepta avisos que dicen solo "Argentina"
  # (sin ciudad), porque casi siempre son en Buenos Aires.
  ubicacion: >-
    buenos aires|\bcaba\b|capital federal|ciudad aut[oó]noma|\bBA\b|
    pilar|escobar|gar[ií]n|tigre|san isidro|vicente l[oó]pez|olivos|mart[ií]nez|munro|
    san fernando|nordelta|la plata|
    ^\W*(remote|remoto|hybrid|h[ií]brido)?\W*argentina\W*(remote|remoto|hybrid|h[ií]brido)?\W*$

  # Empresas del Sheet con estos estados no se monitorean
  excluir_estados: ["Descartada por mí"]

# ------------------------------------------------------------------------------
# Fuentes por empresa. El nombre tiene que coincidir con la columna "Empresa"
# del Sheet (no importan mayúsculas, tildes ni espacios).
#
# Tipos: greenhouse | lever | ashby | smartrecruiters  -> {tipo, slug}
#        workday     -> {tipo, url: https://<tenant>.wdN.myworkdayjobs.com/<sitio>}
#        eightfold   -> {tipo, host, domain, location}
#        oracle_hcm  -> {tipo, host, site}
#        amazon      -> {tipo, location}
#        html        -> {tipo, url, link_regex (opcional)}   # páginas simples, sin JS
# Una empresa puede tener una lista de fuentes.
# Opcional en cualquier fuente: sin_filtro_ubicacion: true
#
# ⚠ Las de abajo las cargué a partir de lo que sé de cada empresa, pero NO las
#   pude probar desde mi entorno. Corré `python detectar_ats.py --verificar` y
#   corregí las que den FALLA (con --url "<link de un aviso>" te sale la línea).
# ------------------------------------------------------------------------------
